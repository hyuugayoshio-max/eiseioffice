<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><title>受付画面 担当者名検索フロー</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--pg:#eef0f5;--tx:#1f3763;--chip:#fff;--chipb:#c9ced9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#14171f;--tx:#d7def0;--chip:#232938;--chipb:#3a4258}}
:root[data-theme="dark"]{--pg:#14171f;--tx:#d7def0;--chip:#232938;--chipb:#3a4258}
html,body{height:100%;margin:0}
body{background:var(--pg);color:var(--tx);font-family:"Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
#wrap{position:relative;width:min(100%,calc((100vh - 120px)*16/9));aspect-ratio:16/9;border-radius:14px;overflow:hidden;box-shadow:0 6px 28px rgba(0,0,0,.25)}
#stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;background:#f5f6f9;color:#222;overflow:hidden}
#stage *{box-sizing:border-box}
.a{position:absolute;transition:all .6s cubic-bezier(.4,0,.2,1)}
.scr{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s}
.s1 #A,.s2 #B{opacity:1;pointer-events:auto}
.pill{display:flex;align-items:center;justify-content:center;background:#e4e7ee;border:3px solid #1f3763;border-radius:999px;color:#1f3763}
.card{background:#e4e7ee;border-radius:20px;box-shadow:0 3px 8px rgba(31,55,99,.12);display:flex;align-items:center;justify-content:center;gap:22px;color:#1f3763;font-weight:500}
.card.w{background:#fff;border:3px solid #1f3763}
.card.b{font-size:38px;font-weight:700;color:#222;border:3px solid #fff}
svg.i{stroke:#1f3763;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.back{left:58px;top:38px;width:173px;height:72px;background:#fff;border:2px solid #1f3763;border-radius:16px;font-size:25px;font-weight:700;color:#1f3763;display:flex;align-items:center;justify-content:center;gap:10px}
#bt{left:374px;top:38px;width:532px;height:100px;font-size:38px}
#sub{left:0;right:0;top:162px;text-align:center;font-size:22px;font-weight:700}
#hint{left:0;right:0;top:412px;text-align:center;font-size:17px;color:#7a8194}
#bar{left:183px;top:250px;width:914px;height:124px;background:#fff;border:3px solid #1f3763;border-radius:26px;display:flex;align-items:center;padding-left:34px;gap:22px;font-size:34px}
#bar svg{width:46px;height:46px;flex:none}
#ph{color:#9aa1b2}#q{color:#1f3763;font-weight:500}
#caret{width:3px;height:56%;background:#1f3763;opacity:0;margin-left:-14px}
.kb #caret{opacity:1;animation:bl 1s steps(1) infinite}.kb #q+#caret,#q:not(:empty)~#ph{margin-left:2px}
@keyframes bl{50%{opacity:0}}
.kb #bt{left:405px;top:26px;width:470px;height:80px;font-size:30px}
.kb #sub,.kb #hint,.kb #lang{opacity:0}
.kb #bar{top:128px;height:100px;border-width:5px;font-size:30px}
#pad{left:77px;top:262px;width:1126px;display:grid;grid-template-columns:repeat(10,1fr);gap:10px;transform:translateY(470px);opacity:0}
.kb #pad{transform:none;opacity:1}
.key{height:65px;background:#fff;border:1px solid #c9ced9;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#1f3763;transition:background .12s,transform .12s}
.key.f{background:#e4e7ee;font-size:23px}.key.pri{background:#1f3763;color:#fff;font-weight:700;font-size:27px}
.key.press{background:#1f3763;color:#fff;transform:scale(.93)}
#lang{left:516px;top:665px;width:247px;height:38px;border:1px solid #c9ced9;border-radius:19px;background:#fff;font-size:13px;color:#444;display:flex;align-items:center;justify-content:center}
#logo{left:826px;top:619px;width:393px}.kb #logo{left:1000px;top:30px;width:220px}
#btnName,#bar,.key,.back{cursor:pointer}
#toast{position:absolute;left:50%;top:252px;transform:translateX(-50%);background:#1f3763;color:#fff;padding:14px 30px;border-radius:14px;font-size:24px;opacity:0;transition:opacity .3s;z-index:9;pointer-events:none;white-space:nowrap}#toast.on{opacity:1}
#ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:15px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--chipb);background:var(--chip);opacity:.55;transition:.3s}
.chip.on{opacity:1;background:#1f3763;color:#fff;border-color:#1f3763}
button{font:inherit;padding:7px 16px;border-radius:999px;border:1px solid var(--chipb);background:var(--chip);color:var(--tx);cursor:pointer}
</style></head><body>

<div id="ctl"><span class="chip on" data-s="1">① 受付トップ</span><span class="chip" data-s="2">② 検索バー</span><span class="chip" data-s="3">③ キーパッド入力</span><button id="re">↺ 最初から</button></div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),wrap=$('#wrap'),cur=$('#cur'),pad=$('#pad');
const fit=()=>stage.style.transform=`scale(${wrap.clientWidth/1280})`;new ResizeObserver(fit).observe(wrap);fit();
const rows=["わらやまはなたさかあ","　り　みひにちしきい","をるゆむふぬつすくう","　れ　めへねてせけえ","んろよもほのとそこお"];
const K={};
for(let r=0;r<5;r++)for(const c of [...Array(10).keys()]){const ch=rows[r][c],d=document.createElement('div');if(ch==='　'){pad.append(d);continue}d.className='key';d.textContent=ch;K[ch]=d;pad.append(d)}
[['削除',2],['全消去',2],['゛',1],['゜',1],['ー',1],['検索',3]].forEach(([t,n])=>{const d=document.createElement('div');d.className='key f'+(t==='検索'?' pri':'');d.style.gridColumn='span '+n;d.textContent=t;K[t]=d;pad.append(d)});
let step=1,typed='';
const mk=(a,b)=>Object.fromEntries([...a].map((c,n)=>[c,b[n]]));
const DK=mk('かきくけこさしすせそたちつてとはひふへほ','がぎぐげござじずぜぞだぢづでどばびぶべぼ'),HD=mk('はひふへほ','ぱぴぷぺぽ');
function render(){stage.className=step===1?'s1':step===2?'s2':'s2 kb';
 $('#q').textContent=typed;$('#ph').style.display=typed?'none':'';
 document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.s==step))}
function tap(t){if(step!==3)return;const d=K[t];d.classList.add('press');setTimeout(()=>d.classList.remove('press'),200);
 const last=typed.slice(-1);
 if(t==='削除')typed=typed.slice(0,-1);else if(t==='全消去')typed='';
 else if(t==='゛'){if(DK[last])typed=typed.slice(0,-1)+DK[last]}
 else if(t==='゜'){if(HD[last])typed=typed.slice(0,-1)+HD[last]}
 else if(t==='検索'){}
 else if(typed.length<12)typed+=t;
 render()}
for(const k in K)K[k].onclick=()=>tap(k);
$('#btnName').onclick=()=>{if(step===1){step=2;render()}};
$('#bar').onclick=()=>{if(step===2){step=3;render()}};
$('#bk').onclick=()=>{if(step>1){step--;typed='';render()}};
$('#re').onclick=()=>{step=1;typed='';render()};
render();
</script></body></html>
